<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF7">
<meta name="robots" content="noindex">
<title>Protocol Cards — Tecnici</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   PROTOCOL CARDS · app tecnici (TSRM)
   Sola lettura. Mostra le schede che il medico ha mandato ai TSRM, dal
   suo telefono o dal PC — fasi, mezzo, peso e nota — e si aggiorna da
   sola tramite il canale cifrato (../desktop/canale.js). Non conserva dati dei pazienti:
   alla riapertura li riceve di nuovo. Sul telefono resta solo
   l'abbinamento.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --canvas:#E8EDF7; --plate:#F3F6FD; --plate-2:#EAF0FA; --sunk:#DCE4F3;
  --ink:#232D3C; --ink-2:#67758B; --ink-3:#8C98AB;
  --jade:#7CCFB0; --jade-ink:#2A7A62; --jade-s:#E1F4EC;
  --coral:#E8735C; --coral-ink:#B3432E; --coral-s:#FBE6E1;
  --amber:#F0C980; --amber-ink:#8A5A0B; --amber-s:#FCF1DC;
  --viola:#5B3FA0; --viola-s:#EEE8FA;
  --line:rgba(35,45,60,.09);
  --ease:cubic-bezier(.19,.86,.22,1);
  --clay:0 22px 38px -20px rgba(35,45,60,.36),0 8px 16px -10px rgba(35,45,60,.18),inset 2px 3px 4px 0 rgba(255,255,255,.95),inset -3px -5px 9px 0 rgba(35,45,60,.09);
  --well-s:inset 2px 3px 6px -2px rgba(35,45,60,.2),inset -1px -2px 4px 0 rgba(255,255,255,.9);
  --gloss:linear-gradient(180deg,#FEFEFF 0%,#F5F8FD 46%,#E9EFFA 46.01%,#DEE7F6 100%);
  --gloss-down:linear-gradient(180deg,#E1E9F6 0%,#EAF0FA 54%,#F5F8FD 54.01%,#FCFDFF 100%);
  --lip:inset 0 1px 0 0 #fff,inset 0 -1px 0 0 rgba(35,45,60,.12);
  --lift:0 10px 18px -11px rgba(35,45,60,.6),0 2px 4px -2px rgba(35,45,60,.16);
  --f-disp:'Outfit','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-text:'Albert Sans','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70vw 50vw at 10% 0%,rgba(183,212,245,.55),transparent 62%),
             radial-gradient(60vw 50vw at 95% 20%,rgba(124,207,176,.30),transparent 64%)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:300;letter-spacing:-.022em;margin:0;line-height:1.12}
p{margin:0}
.shell{position:relative;z-index:1;width:min(560px,100%);margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px 10px;background:linear-gradient(var(--canvas) 70%,rgba(232,237,247,0))}
.bar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--gloss);box-shadow:var(--lift),var(--lip)}
.mark{width:28px;height:28px;border-radius:10px;flex:0 0 auto;position:relative;background:linear-gradient(155deg,#9BDCC3,var(--jade) 55%,#5FBB9C);
  box-shadow:0 8px 14px -8px rgba(42,122,98,.8),inset 1px 2px 3px rgba(255,255,255,.75),inset -2px -3px 5px rgba(20,80,62,.28)}
.mark::after{content:"";position:absolute;left:50%;top:52%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:99px 99px 99px 3px;background:rgba(18,63,51,.55)}
.brand{min-width:0}
.brand b{display:block;font-family:var(--f-disp);font-weight:500;font-size:1rem;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:.68rem;color:var(--ink-2);white-space:nowrap}
.stato{margin-left:auto;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:.72rem;font-weight:700;
  background:var(--sunk);color:var(--ink-2);box-shadow:var(--well-s);white-space:nowrap}
.stato i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.stato.ok{background:var(--jade-s);color:var(--jade-ink)}.stato.ok i{background:var(--jade);box-shadow:0 0 0 3px rgba(124,207,176,.35)}
.stato.attesa{background:var(--amber-s);color:var(--amber-ink)}.stato.attesa i{background:var(--amber)}
.stato.ko{background:var(--coral-s);color:var(--coral-ink)}.stato.ko i{background:var(--coral)}
.menu{width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;background:transparent;font-size:1.1rem;color:var(--ink-2)}

.giorno{display:flex;align-items:baseline;gap:10px;margin:18px 4px 12px}
.giorno h1{font-size:1.6rem}
.giorno span{font-size:.8rem;color:var(--ink-2)}
.giorno .plan{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--viola-s);color:var(--viola)}
.nota-sola{margin:0 4px 6px;font-size:.76rem;color:var(--ink-3)}

.carte{display:flex;flex-direction:column;gap:12px}
.carta{position:relative;border-radius:24px;padding:16px 16px 14px;background:linear-gradient(160deg,#FAFCFF,var(--plate) 46%,var(--plate-2));box-shadow:var(--clay)}
.carta.fatta{opacity:.55}
.carta.prossima{box-shadow:var(--clay),inset 0 0 0 2px var(--jade)}
.carta.nuova::after{content:"aggiornato";position:absolute;top:14px;right:14px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--amber-s);color:var(--amber-ink);animation:sfuma 6s forwards}
@keyframes sfuma{0%,80%{opacity:1}100%{opacity:0}}
.c-testa{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.c-ora{font-family:var(--f-disp);font-size:1.7rem;font-weight:400;color:var(--jade-ink);letter-spacing:-.02em}
.c-acc{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.c-badge{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.c-badge.ps{background:var(--coral-s);color:var(--coral-ink)}
.c-badge.eseguito{background:var(--sunk);color:var(--ink-2)}
.c-esame{font-size:.78rem;font-weight:600;color:var(--ink-2);margin-top:2px}
.c-quesito{font-size:.84rem;color:var(--ink-2);margin-top:2px}
.c-proto{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.c-proto h3{font-size:1.25rem}
.fonte{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--jade-s);color:var(--jade-ink)}
.fonte.personale{background:var(--viola-s);color:var(--viola)}
.fasi{display:flex;flex-direction:column;gap:6px}
.fase{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.65);box-shadow:var(--well-s)}
.fase .rit{font-size:.84rem;font-weight:600}
.fase .zona{grid-column:2;font-size:.74rem;color:var(--ink-2)}
.ftag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:99px;font-size:.74rem;font-weight:700;white-space:nowrap;
  background:var(--bg);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(35,45,60,.06)}
.ftag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mdc{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--sunk);box-shadow:var(--well-s)}
.mdc .v b{font-family:var(--f-disp);font-weight:400;font-size:1.45rem}
.mdc .v span{font-size:.74rem;color:var(--ink-2);margin-left:3px}
.mdc small{flex-basis:100%;font-size:.74rem;color:var(--ink-2)}
.mdc .avv{color:var(--coral-ink)}
.nota-med{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--amber-s);color:#5A3A05;font-size:.84rem;white-space:pre-wrap}
.nota-med b{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink);margin-bottom:2px}

.vuoto,.abbina{margin-top:30px;padding:28px 22px;border-radius:26px;text-align:center;background:linear-gradient(160deg,#FAFCFF,var(--plate) 46%,var(--plate-2));box-shadow:var(--clay)}
.vuoto h2,.abbina h2{font-size:1.4rem;margin-bottom:8px}
.vuoto p,.abbina p{font-size:.88rem;color:var(--ink-2)}
.abbina ol{text-align:left;font-size:.88rem;color:var(--ink-2);margin:14px 0 0;padding-left:20px}
.abbina li{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border:0;border-radius:99px;cursor:pointer;font-weight:600;font-size:.88rem;
  background-image:var(--gloss);box-shadow:var(--lift),var(--lip)}
.btn:active{background-image:var(--gloss-down)}
.btn.danger{color:var(--coral-ink)}
.btn.solid{background-image:linear-gradient(180deg,#B2E7D2 0%,#90D9BD 46%,#6BC5A5 46.01%,#52B492 100%);color:#0E3A2E;
  box-shadow:0 12px 20px -11px rgba(42,122,98,.9),inset 0 1px 0 0 rgba(255,255,255,.8),inset 0 -1px 0 0 rgba(16,72,56,.4)}
.btn.grande{height:52px;padding:0 26px;font-size:1rem;margin-top:18px}
.abbina .alt{margin-top:14px;font-size:.78rem;color:var(--ink-3)}
.scan{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#0D1520}
.scan.on{display:flex}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .mirino{position:absolute;left:50%;top:44%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:26px;
  box-shadow:0 0 0 100vmax rgba(13,21,32,.55);outline:3px solid rgba(124,207,176,.95);outline-offset:-3px}
.scan .mirino::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:rgba(124,207,176,.8);
  box-shadow:0 0 12px rgba(124,207,176,.9);animation:linea 2.2s ease-in-out infinite}
@keyframes linea{0%,100%{transform:translateY(-110px)}50%{transform:translateY(110px)}}
.scan .giu{position:relative;margin-top:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;color:#fff;
  background:linear-gradient(transparent,rgba(13,21,32,.85) 40%)}
.scan .giu p{font-size:.92rem;line-height:1.45;margin:0 auto 14px;max-width:34ch}
.scan .btn{color:var(--ink)}
.foglio{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(35,45,60,.3)}
.foglio.on{display:flex}
.foglio > div{width:100%;max-width:560px;margin:0 auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--plate);box-shadow:var(--clay)}
.foglio h3{font-size:1.2rem;margin-bottom:6px}
.foglio p{font-size:.84rem;color:var(--ink-2);margin-bottom:16px}
.foglio .riga{display:flex;gap:10px}
.foglio .riga .btn{flex:1}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="bar">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand"><b>Protocol Cards</b><small>TSRM · sola lettura</small></div>
      <span class="stato" id="stato"><i></i><span>avvio…</span></span>
      <button class="menu" id="menu" aria-label="Impostazioni" hidden>⋯</button>
    </div>
  </header>
  <main id="vista"></main>
</div>

<div class="scan" id="scan" role="dialog" aria-modal="true" aria-label="Scansione del codice">
  <video id="scanVideo" playsinline muted></video>
  <div class="mirino" aria-hidden="true"></div>
  <div class="giu"><p id="scanMsg"></p><button class="btn" id="scanChiudi">Annulla</button></div>
</div>

<div class="foglio" id="foglio" role="dialog" aria-modal="true" aria-labelledby="fTit">
  <div>
    <h3 id="fTit">Questo telefono</h3>
    <p id="fTesto"></p>
    <div class="riga"><button class="btn" id="fChiudi">Chiudi</button><button class="btn" id="fScansiona">Nuovo codice</button><button class="btn danger" id="fScollega">Scollega</button></div>
  </div>
</div>

<script src="../desktop/protocolli.js"></script>
<script src="../desktop/canale.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const PR = Protocolli;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const it = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
const K_CANALE = 'protocol-cards.tecnico.canale', K_DEV = 'protocol-cards.tecnico.dev';
const leggi = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const scrivi = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} };

/* identità del telefono: un codice casuale e sistema/browser, per far
   vedere al medico quali telefoni sono aggiornati                      */
let dev = leggi(K_DEV);
if (!dev) { dev = Math.random().toString(36).slice(2, 10); scrivi(K_DEV, dev); }
function nomeDispositivo() {
  const u = navigator.userAgent;
  const so = /iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'telefono';
  const br = /EdgA?\//.test(u) ? 'Edge' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
  return [so, br].filter(Boolean).join(' · ') + ' · ' + dev.slice(0, 4);
}

/* Due fonti sullo stesso canale:
   · telefono del medico ('med'): ogni volta l'elenco completo delle
     schede inviate, che sostituisce il precedente;
   · PC ('pc'): solo le schede inviate o ritirate in quel momento, che si
     sommano, così un PC riaperto non cancella ciò che aveva già inviato.
   Una scheda presente in tutte e due vale nella versione inviata per
   ultima (t = momento dell'invio).                                    */
let sess = null, attuale = null, prima = new Map();
let dalTel = null;                                 // ultima istantanea del telefono { seq, cards }
const dalPC = new Map();                           // id → scheda inviata dal PC
const ritiratiPC = new Map();                      // id → momento del ritiro
let ultimoArrivo = 0;
function unisci() {
  const per = new Map();
  const metti = c => { const x = per.get(c.id); if (!x || (c.t || 0) >= (x.t || 0)) per.set(c.id, c); };
  (dalTel ? dalTel.cards : []).forEach(metti);
  dalPC.forEach(metti);
  const cards = [...per.values()].sort((a, b) => ((a.data || '') + a.ora).localeCompare((b.data || '') + b.ora));
  return { seq: ultimoArrivo, cards };
}
function ricevi(x) {
  if (x.fonte === 'pc') {
    (x.ritirati || []).forEach(r => { const c = dalPC.get(r.id);
      if (!c || (c.t || 0) <= r.t) { dalPC.delete(r.id); ritiratiPC.set(r.id, r.t); } });
    (x.cards || []).forEach(c => { const g = dalPC.get(c.id), rit = ritiratiPC.get(c.id) || 0;
      if ((c.t || 0) > rit && (!g || (c.t || 0) >= (g.t || 0))) dalPC.set(c.id, c); });
    return true;
  }
  if (dalTel && x.seq <= dalTel.seq) return false;
  dalTel = { seq: x.seq, cards: x.cards || [] };
  return true;
}
/* al collegamento il relay ripete le pubblicazioni delle ultime ore, in
   ordine: in quei primi secondi le differenze non sono novità          */
let quietoFino = 0;

function stato(cls, testo) { const s = $('stato'); s.className = 'stato ' + cls; s.lastChild.textContent = testo; }
const oraDi = ms => new Date(ms).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

/* ── abbinamento ── */
async function avvia() {
  if (!window.crypto || !crypto.subtle || typeof Canale === 'undefined') {
    stato('ko', 'non supportato');
    return mostra(`<div class="abbina"><h2>Browser non supportato</h2><p>Apri l'app con Chrome o Safari aggiornati.</p></div>`);
  }
  /* il codice porta la chiave nel frammento: si salva e si toglie subito
     dalla barra degli indirizzi e dalla cronologia                     */
  const dalQR = Canale.daFrammento(location.hash);
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (dalQR) scrivi(K_CANALE, JSON.stringify(dalQR));
  let link = null;
  try { link = JSON.parse(leggi(K_CANALE) || 'null'); } catch (_) {}
  if (!Canale.valido(link)) return nonAbbinato();
  try { sess = await Canale.apri(link); } catch (_) { scrivi(K_CANALE, null); return nonAbbinato(); }
  $('menu').hidden = false;
  stato('attesa', 'collegamento…');
  mostraCarte();
  const raccogli = Canale.raccoglitore('tecnici');
  let salutato = false;
  Canale.ascolta(sess, 'tec', {
    stato: async s => {
      if (s === 'aperto') {
        quietoFino = Date.now() + 4000;
        stato(attuale ? 'ok' : 'attesa', attuale ? 'aggiornato ' + oraDi(attuale.seq) : 'in attesa');
        if (!salutato) { salutato = true;
          try { await Canale.invia(sess, 'tec', { tipo: 'ciao', dev, nome: nomeDispositivo(), seq: dalTel ? dalTel.seq : 0 }); } catch (_) {} }
      }
      if (s === 'riconnessione') stato('ko', 'senza rete · riprovo');
    },
    messaggio: async m => {
      let r; try { r = raccogli(m); } catch (_) { return; }
      if (!r) return;
      let x; try { x = await Canale.leggiLista(r); } catch (_) { return; }
      if (!x || !Array.isArray(x.cards) || !ricevi(x)) return;
      prima = new Map(attuale ? attuale.cards.map(c => [c.id, JSON.stringify(c)]) : []);
      const primoArrivo = !attuale;
      ultimoArrivo = Math.max(ultimoArrivo, x.seq || 0);
      attuale = unisci();
      stato('ok', 'aggiornato ' + oraDi(ultimoArrivo));
      mostraCarte(primoArrivo);
      /* la ricevuta serve al telefono del medico: dice quale sua versione si ha */
      if (x.fonte !== 'pc') try { await Canale.invia(sess, 'tec', { tipo: 'visto', dev, nome: nomeDispositivo(), seq: x.seq }); } catch (_) {}
    },
  });
}

function nonAbbinato() {
  stato('', 'non collegato');
  $('menu').hidden = true;
  mostra(`<div class="abbina">
    <h2>Collega questo telefono</h2>
    <p>L'app mostra, in sola lettura, le schede che il medico manda ai TSRM.</p>
    <ol>
      <li>Sul telefono del medico: <b>Impostazioni → App tecnici → Mostra il codice</b>.</li>
      <li>Qui, tocca <b>Scansiona il codice</b> e inquadralo.</li>
    </ol>
    <button class="btn solid grande" id="scanApri">Scansiona il codice</button>
    <p class="alt">In alternativa puoi inquadrarlo con la fotocamera del telefono: si apre questa pagina, già collegata.</p>
  </div>`);
  $('scanApri').onclick = apriScanner;
}

/* ── schede ── */
const oggiIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const adesso = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
/* tag della fase: colori dal modulo condiviso; per le fasi che non ci sono
   (il ritardo 5' dell'encefalo) si usa il colore mandato dal medico   */
function tag(f) {
  const F = PR.FASI[f.fase], c = (F && F.c) || f.c || '#8A94A6';
  const bg = (F && F.bg) || `color-mix(in srgb, ${c} 14%, white)`, tx = (F && F.tx) || c;
  return `<span class="ftag" style="--c:${c};--bg:${bg};--tx:${tx}">${esc(f.l || (F && F.l) || f.fase)}</span>`;
}
const ritardo = f => f.fase === 'basale' ? 'senza contrasto' : f.delay === 'B-T' ? 'bolus tracking' : f.delay ? `+${f.delay} s` : 'ritardo non indicato';
const zone = f => (f.zone || []).map(z => { const l = PR.ZONE_L[z];
  return l && l.replace(/[^a-z0-9]/gi, '').toLowerCase() !== z.replace(/[^a-z0-9]/gi, '').toLowerCase() ? `${l} (${z})` : z; }).join(' + ');

function mostra(html) { $('vista').innerHTML = html; }

function mostraCarte(primoArrivo) {
  if (!attuale) return mostra(`<div class="vuoto"><h2>In attesa del medico</h2>
    <p>Qui compariranno le schede man mano che il medico le manda ai TSRM.</p></div>`);
  if (!attuale.cards.length) return mostra(`<div class="vuoto"><h2>Nessuna scheda</h2>
    <p>Il medico non ha ancora mandato schede ai TSRM. Compariranno qui da sole.</p></div>`);
  /* un giorno per blocco: oggi, poi il planning dei giorni a venire */
  const giorni = [...new Set(attuale.cards.map(c => c.data))].filter(d => d >= oggiIso()).sort();
  mostra(`<p class="nota-sola">Schede mandate dal medico · sola lettura</p>` + giorni.map(d => {
    const cards = attuale.cards.filter(c => c.data === d);
    const oggi = d === oggiIso();
    const titolo = oggi ? 'Oggi' : new Date(d + 'T12:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    const ora = adesso();
    const prossima = oggi ? cards.findIndex(c => !c.fatto && (c.ora || '') >= ora) : -2;
    return `<div class="giorno"><h1>${esc(titolo.charAt(0).toUpperCase() + titolo.slice(1))}</h1>
        ${oggi ? '' : '<span class="plan">planning</span>'}<span>${cards.length} ${cards.length === 1 ? 'scheda' : 'schede'}</span></div>
      <div class="carte">${cards.map((c, i) => carta(c, i === prossima, primoArrivo)).join('')}</div>`;
  }).join('') || `<div class="vuoto"><h2>Nessuna scheda per oggi</h2><p>Le schede dei giorni passati non vengono mostrate.</p></div>`);
}

function carta(c, prossima, primoArrivo) {
  const nuova = !primoArrivo && Date.now() > quietoFino && prima.size && prima.get(c.id) !== JSON.stringify(c);
  const mdc = c.fasi.some(f => f.fase !== 'basale');
  const vol = mdc && c.peso > 0 && c.agente ? c.giKg * c.peso / c.agente.c : 0;
  const flusso = mdc && c.agente ? c.idr / c.agente.c : 0;
  const dose = `${it(c.giKg, 2)} gI/kg · IDR ${it(c.idr)} gI/s`;
  const cls = ['carta', prossima ? 'prossima' : '', c.fatto ? 'fatta' : '', nuova ? 'nuova' : ''].filter(Boolean).join(' ');
  return `<article class="${cls}">
    <div class="c-testa"><span class="c-ora">${esc(c.ora || '—')}</span><span class="c-acc">${esc(c.id)}</span>
      ${c.modo === 'emergenza' ? '<span class="c-badge ps">pronto soccorso</span>' : ''}
      ${c.fatto ? '<span class="c-badge eseguito">eseguito</span>' : ''}</div>
    <div class="c-esame">${esc(c.esame)}</div>
    ${c.quesito ? `<div class="c-quesito">${esc(c.quesito)}</div>` : ''}
    <div class="c-proto"><h3>${esc(c.proto)}</h3><span class="fonte ${c.personale ? 'personale' : ''}">${c.personale ? 'personale' : 'ufficiale'}</span></div>
    <div class="fasi">${c.fasi.map(f => `<div class="fase">${tag(f)}<span class="rit">${esc(ritardo(f))}</span><span class="zona">${esc(zone(f))}</span></div>`).join('')}</div>
    ${mdc ? c.agente ? `<div class="mdc">
        ${vol ? `<span class="v"><b>${Math.round(vol)}</b><span>ml</span></span>` : ''}<span class="v"><b>${it(flusso)}</b><span>ml/s</span></span>
        <small>${esc(c.agente.l)} · ${c.peso ? `${esc(c.peso)} kg · ` : ''}${dose}</small>
        ${vol > 150 ? '<small class="avv">Volume elevato: verifica con il medico.</small>' : ''}
        ${flusso > 5 ? '<small class="avv">Flusso alto: serve un accesso venoso adeguato (≥18G).</small>' : ''}
      </div>` : `<div class="mdc"><span class="v"><b>${it(c.giKg, 2)}</b><span>gI/kg</span></span><span class="v"><b>${it(c.idr)}</b><span>gI/s</span></span>
        <small>Dal PC: peso e mezzo si definiscono in sala, volume e flusso di conseguenza.</small></div>` : ''}
    ${c.nota ? `<div class="nota-med"><b>Nota del medico</b>${esc(c.nota)}</div>` : ''}
  </article>`;
}

/* la scheda «prossima» segue l'orologio */
setInterval(() => { if (attuale) mostraCarte(true); }, 60000);

/* ── impostazioni ── */
$('menu').onclick = () => {
  $('fTesto').textContent = `Collegato al telefono del medico come «${nomeDispositivo()}». «Nuovo codice» scansiona il codice di un nuovo abbinamento; scollegando, questo telefono smette di ricevere le schede.`;
  $('foglio').classList.add('on');
};
$('fChiudi').onclick = () => $('foglio').classList.remove('on');
$('foglio').addEventListener('click', e => { if (e.target === $('foglio')) $('foglio').classList.remove('on'); });
$('fScollega').onclick = () => { scrivi(K_CANALE, null); location.reload(); };
$('fScansiona').onclick = () => { $('foglio').classList.remove('on'); apriScanner(); };

/* ── scansione del codice, dentro l'app ──
   Il tecnico inquadra il codice dal telefono del medico senza uscire
   dall'app: aggiunta alla schermata Home, la fotocamera di sistema
   aprirebbe il link in una scheda del browser, e l'abbinamento finirebbe
   lì. Si usa il lettore del browser (BarcodeDetector, Chrome per Android);
   dove manca (Safari su iPhone) si carica jsQR, incorporato nel progetto. */
let scan = null;                                  // { stream, timer, fermo }

/* il codice dei tecnici ha la forma …/tecnico/#t=…&k=…; quello che abbina
   il PC al telefono del medico ha la stessa chiave ma un altro indirizzo */
function leggiCodice(testo) {
  let u; try { u = new URL(String(testo).trim()); } catch (_) { return { errore: 'Questo codice non è di Protocol Cards.' }; }
  const a = Canale.daFrammento(u.hash);
  if (!a) return { errore: 'Questo codice non è di Protocol Cards.' };
  if (!/\/tecnico\/?$/.test(u.pathname)) return { errore: 'Questo è il codice che collega il telefono del medico al PC. Serve quello dell’app tecnici: sul telefono del medico, Impostazioni → App tecnici → Mostra il codice.' };
  return { a };
}

function caricaJsQR() {
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = '../desktop/vendor/jsQR.js';
    s.onload = () => window.jsQR ? ok(window.jsQR) : ko(new Error('lettore non disponibile'));
    s.onerror = () => ko(new Error('lettore non disponibile: serve la rete al primo uso'));
    document.head.appendChild(s);
  });
}
async function lettoreQR() {
  if ('BarcodeDetector' in window) {
    try {
      const formati = await BarcodeDetector.getSupportedFormats();
      if (formati.includes('qr_code')) {
        const d = new BarcodeDetector({ formats: ['qr_code'] });
        return async video => { const r = await d.detect(video); return r[0] ? r[0].rawValue : null; };
      }
    } catch (_) {}
  }
  const jsQR = await caricaJsQR();
  const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
  return async video => {
    const w = video.videoWidth, h = video.videoHeight; if (!w || !h) return null;
    const k = Math.min(1, 640 / Math.max(w, h));             // basta una risoluzione modesta
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    g.drawImage(video, 0, 0, c.width, c.height);
    const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
    return r ? r.data : null;
  };
}

async function apriScanner() {
  $('scan').classList.add('on');
  const msg = t => { $('scanMsg').textContent = t; };
  msg('Avvio della fotocamera…');
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return msg('La fotocamera non è disponibile da questa pagina. Inquadra il codice con la fotocamera del telefono.');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    return msg(e && e.name === 'NotAllowedError'
      ? 'Permesso della fotocamera negato. Consentilo nelle impostazioni del browser, oppure inquadra il codice con la fotocamera del telefono.'
      : 'Nessuna fotocamera disponibile.');
  }
  const video = $('scanVideo');
  video.srcObject = stream;
  try { await video.play(); } catch (_) {}
  scan = { stream, timer: null, fermo: false };
  let leggi;
  try { leggi = await lettoreQR(); } catch (e) { msg(e.message); return; }
  msg('Inquadra il codice sul telefono del medico');
  const giro = async () => {
    if (!scan || scan.fermo) return;
    let testo = null;
    try { testo = await leggi(video); } catch (_) {}
    if (testo) {
      const r = leggiCodice(testo);
      if (r.a) {
        scan.fermo = true;
        if (navigator.vibrate) navigator.vibrate(60);
        msg('Codice letto: collegamento…');
        scrivi(K_CANALE, JSON.stringify(r.a));
        setTimeout(() => { chiudiScanner(); location.reload(); }, 350);
        return;
      }
      msg(r.errore);
    }
    scan.timer = setTimeout(giro, 160);
  };
  giro();
}
function chiudiScanner() {
  if (scan) { scan.fermo = true; clearTimeout(scan.timer); scan.stream.getTracks().forEach(t => t.stop()); scan = null; }
  $('scanVideo').srcObject = null;
  $('scan').classList.remove('on');
}
$('scanChiudi').onclick = chiudiScanner;
document.addEventListener('visibilitychange', () => { if (document.hidden && scan) chiudiScanner(); });

avvia();
</script>
